version: 2

# Dependencies rot quietly. Monthly rather than weekly, and grouped, because on
# a solo project a flood of one-line PRs gets ignored — and an ignored bot is
# worse than no bot.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    target-branch: develop
    labels: [dependencies]
    groups:
      # Everything non-breaking in one PR that CI can verify in one run.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Every major here is a migration, not a bump. The first run proved it:
      # TypeScript 7 and eslint-config-next 16 both failed CI within minutes,
      # and a bot that regularly opens PRs which cannot be merged trains you to
      # ignore the ones that can. Majors get done deliberately, by hand.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Action majors stay allowed: CI verifies them on the very PR that proposes
  # them, and a stale action is how the Node 20 deprecation warning appeared.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    labels: [dependencies]
