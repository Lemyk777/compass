name: CI

# The repository had no automated verification at all: the only thing standing
# between a broken change and production was remembering to run three commands
# by hand. Since main deploys to production, that gap was the single biggest
# structural risk in the project.
#
# Everything here runs WITHOUT secrets. The app builds without environment
# variables (auth and analysis degrade, the build does not), and the logic
# checks are pure — no API key, no database, no network.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Build, types and logic checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `next build` is the lint + type-check gate, not just a bundler.
      - name: Build
        run: npm run build

      # Pure logic: geography, eligibility gates, registry integrity, the
      # commitment vocabulary, cron rotation maths.
      - name: Logic checks
        run: node --import tsx scripts/test-session-checks.ts

      # Unit tests for the deterministic engine: scoring (rubric/assemble),
      # eligibility arithmetic, the interest quiz, matching invariants.
      - name: Engine unit tests
        run: npm run test:unit

# Link health is deliberately NOT here. It hits ~100 third-party sites, and
# from shared CI runners the answers differ from what a student gets: the very
# first run reported NYU Shanghai as broken while it returned 200 from a normal
# connection, and flagged seven more as bot-walled that pass locally. Datacenter
# IPs are blocked far more aggressively. A weekly job in link-health.yml carries
# it instead, and its failures are a "go and look", not a verdict.
