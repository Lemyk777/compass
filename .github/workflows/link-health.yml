name: Link health

# A dead link is the most visible quality failure in the product — the student
# clicks "Details" and gets a browser error, which makes the whole catalog look
# fake. A student found one before we did. Links rot on their own schedule, so
# this checks weekly rather than waiting for someone to push.
#
# READ A FAILURE HERE AS "GO AND LOOK", NOT AS A VERDICT. These runners come
# from datacenter IP ranges that many sites block outright: the first run
# reported NYU Shanghai broken and seven others bot-walled, all of which answer
# normally from an ordinary connection. Always reproduce with `npm run
# test:links` locally before touching a catalog entry — and never delete a URL
# on the strength of one bad day, since two "dead" links recovered by
# themselves within the hour.

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  links:
    name: Every catalog URL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:links
